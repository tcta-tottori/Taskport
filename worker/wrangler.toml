name = "taskport-parse"
main = "index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# リクエスト本文をログに残さない。業務情報が含まれるため。
[observability]
enabled = false

[vars]
# 本番では必ず配信元オリジンを入れる（未設定だと誰でも呼べる）。
# 例: "https://tcta-tottori.github.io"
ALLOWED_ORIGINS = ""
# 使うモデル。CLAUDE.md §5 の既定。
MODEL = "claude-sonnet-4-6"

# APIキーは vars に書かない。次のコマンドで登録する:
#   npx wrangler secret put ANTHROPIC_API_KEY

# レート制限を使う場合は KV を作って紐づける:
#   npx wrangler kv namespace create RATE_LIMIT_KV
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<作成された id>"
