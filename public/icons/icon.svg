<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Taskport">
  <!--
    アプリアイコンの元絵。ここを直して scripts/makeIcons.mjs で PNG を作り直す。
    ファビコン（32/48px）も同じこの1枚から焼くので、地を変えると両方が変わる。

    【地は端まで塗る】
    v1.10 のアイコンは「白い角丸のカード」を絵の中に描いていた。Android は
    受け取った絵をさらに角丸で切り抜くので、枠が二重に見え、そのぶん中の絵が
    小さくなっていた（利用者の指摘）。地は 512×512 の全面を塗り、角丸は
    端末側に任せる。

    【地はほんの少しくすんだ白】
    v1.13.1 で藍〜菫の色面をやめた（利用者の指示）。アプリ本体が白地なので、
    アイコンの地もそれに合わせる。真っ白にしないのは、白い通知シェードや
    白いブラウザのタブの上に置いたとき、輪郭が消えてしまうため。
    絵のほうを藍〜菫で塗って、明暗を入れ替えてある。

    【安全域】
    maskable は中央 80%（直径 409px）の円までしか残らないことがある。
    絵はすべてこの円の内側に収めてある。
  -->
  <defs>
    <!-- 絵の側の色。userSpaceOnUse にして、台紙と済の印で1本の帯が続くようにする -->
    <linearGradient id="tpInk" gradientUnits="userSpaceOnUse" x1="124" y1="122" x2="392" y2="392">
      <stop offset="0" stop-color="#3f4fc4" />
      <stop offset="0.55" stop-color="#5b45bd" />
      <stop offset="1" stop-color="#7b3fae" />
    </linearGradient>
  </defs>

  <!-- 地。ほんの少しだけくすんだ白（白地のアプリ本体と同じ系統） -->
  <rect width="512" height="512" fill="#f2f4f8" />

  <g id="tp-glyph">
    <!-- 綴じ具 -->
    <rect x="176" y="122" width="16" height="52" rx="8" fill="url(#tpInk)" />
    <rect x="320" y="122" width="16" height="52" rx="8" fill="url(#tpInk)" />

    <!-- 台紙 -->
    <rect x="124" y="148" width="264" height="208" rx="28" fill="url(#tpInk)" />
    <!-- 見出しの帯 -->
    <path d="M124 176a28 28 0 0 1 28-28h208a28 28 0 0 1 28 28v26H124z" fill="#ffffff" fill-opacity=".22" />

    <!-- 日付のマス -->
    <g fill="#ffffff" fill-opacity=".42">
      <rect x="152" y="228" width="42" height="34" rx="10" />
      <rect x="206" y="228" width="42" height="34" rx="10" />
      <rect x="260" y="228" width="42" height="34" rx="10" />
      <rect x="314" y="228" width="42" height="34" rx="10" />
      <rect x="152" y="276" width="42" height="34" rx="10" />
      <rect x="260" y="276" width="42" height="34" rx="10" />
      <rect x="152" y="324" width="42" height="34" rx="10" />
    </g>
    <!-- 今日 -->
    <rect x="206" y="276" width="42" height="34" rx="10" fill="#ffffff" />

    <!-- 済の印。地と同じ色の輪で台紙から切り離す（32px でも粒が分かれて見える） -->
    <circle cx="330" cy="330" r="62" fill="#f2f4f8" />
    <circle cx="330" cy="330" r="52" fill="url(#tpInk)" />
    <path d="M306 331l16 17 32-35" fill="none" stroke="#ffffff" stroke-width="17"
          stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
